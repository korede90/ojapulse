services:
  - type: web
    name: naijaprice-ai-api
    env: python
    buildCommand: pip install -r requirements.txt && python data/prepare_datasets.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: naijaprice-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: naijaprice-ai-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: naijaprice-ai-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: naijaprice-postgres
    plan: free
    databaseName: naijaprice
    user: naijaprice_user
